name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-build-test:
    name: check / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (all workspaces)
        run: npm run lint
      - name: Typecheck (all workspaces)
        run: npm run check
      - name: Build (shared + web)
        run: npm run build
      - name: Test
        run: npm run test
