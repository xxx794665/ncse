name: Deploy Pages

# GH Pages 前端发布（T1-13b）：main 分支 web 相关改动 → 构建 apps/web → 发布 Pages。
# 与 ci.yml（全量门禁）并行：本工作流只负责构建与发布，质量门禁由 CI 保证。
# Pages 站点：https://ncse.xxx794665.party/（自定义域名，T1-13c；子路径由 apps/web/.env.production
# 的 VITE_BASE_PATH 决定，自定义域名按根路径服务）。
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留最新一次发布，旧的运行取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: build & deploy web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (shared + web)
        run: npm run build
      # GH Pages 静态托管不回退 SPA 路由：深链（如 /ncse/practice）命中 404.html，
      # 复制构建产物 index.html 使应用照常引导后由 Router 按 pathname 渲染（状态码 404 属预期）。
      - name: SPA deep-link fallback (404)
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      # Workers 线上端点 healthz canary：本地（大陆）无法验证 workers.dev（DNS 污染 + SNI 封锁），
      # 由境外 runner 在发布前端前验证 API 可用（T1-13a 的 HTTP 级验证亦由本步骤承载）。
      # 自定义域名（T1-13c，大陆可达）为正式端点、workers.dev 为备用端点，两者都验。
      - name: API canary (Workers healthz)
        run: |
          set -e
          for endpoint in https://ncse-api.xxx794665.party https://ncse-api.249939260.workers.dev; do
            echo "== $endpoint =="
            body=$(curl -sS --fail --retry 3 --retry-delay 5 "$endpoint/healthz")
            echo "$body"
            echo "$body" | grep -q '"status":"ok"'
            echo "$body" | grep -q '"service":"ncse-api"'
          done
      # 探测并按需启用 Pages（source = GitHub Actions）。首跑 configure-pages 的 enablement 分支失败，
      # 改用 runner 预装 gh + 本 workflow 的 GITHUB_TOKEN（pages: write）直接调 REST API，
      # 诊断结果写入 GITHUB_OUTPUT 并经下方 Signal 步骤的结论外显（步骤结论可经公开 API 远程读取）。
      - name: Probe & enable Pages site
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages-info.json 2>/tmp/pages-err.txt; then
            echo "state=exists" >> "$GITHUB_OUTPUT"
            cat /tmp/pages-info.json
          elif grep -qi "Not Found" /tmp/pages-err.txt; then
            echo "state=not_found" >> "$GITHUB_OUTPUT"
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/tmp/pages-create.json 2>/tmp/pages-create-err.txt; then
              echo "created=true" >> "$GITHUB_OUTPUT"
              cat /tmp/pages-create.json
            else
              echo "created=false" >> "$GITHUB_OUTPUT"
              cat /tmp/pages-create-err.txt
            fi
          else
            echo "state=forbidden_or_other" >> "$GITHUB_OUTPUT"
            cat /tmp/pages-err.txt
            exit 1
          fi
      - name: 'Signal: Pages site already exists'
        if: steps.pages.outputs.state == 'exists'
        run: echo "Pages site already exists"
      - name: 'Signal: Pages site created via API'
        if: steps.pages.outputs.state == 'not_found' && steps.pages.outputs.created == 'true'
        run: echo "Pages site created (build_type=workflow)"
      # 未能自动启用：GITHUB_TOKEN 无权创建 Pages 站点——需用户在仓库 Settings→Pages 手动选
      # Source=GitHub Actions（一次性），之后本工作流即可全自动发布。
      - name: 'Signal: enable failed (needs one-time manual enable in repo Settings→Pages)'
        if: steps.pages.outputs.state == 'not_found' && steps.pages.outputs.created == 'false'
        run: exit 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
