name = "ncse-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# 本地开发配置（`npm run dev` = wrangler dev）；`wrangler deploy` 用同一配置发远端。
# 凭据一律走 `wrangler secret`；本地用不入库的 .dev.vars（CLAUDE.md 安全约束）。
[dev]
port = 8787

# D1 数据库绑定（T1-02 落地；schema 见 src/db/schema/，迁移产物见 apps/api/migrations/）。
# database_id 为远端真实库（T1-13 创建于 WNAM 区域；本地 `--local` 模式不读该 ID）。
# 远端 schema 变更：`wrangler d1 migrations apply ncse-db --remote`。
[[d1_databases]]
binding = "DB"
database_name = "ncse-db"
database_id = "887c5e14-05f0-4042-b2fb-8505d5757a6b"
migrations_dir = "migrations"

# R2 图片桶绑定（T1-08d 落地；题目图片内容寻址对象，键形态见 ADR-0007）。
# 桶 ncse-images 已于 T1-13 创建（WNAM）；本地 dev 消费本地模拟 R2，远端为真实桶。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ncse-images"
